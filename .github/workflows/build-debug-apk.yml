name: Build Lotus debug APK


on:
  workflow_dispatch:
  push:
    branches:
      - main


permissions:
  contents: read


jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4


      - name: Java 17 instellen
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      - name: Eigen Android SDK installeren
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --output /tmp/android-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      - name: Gradle 8.7 ophalen
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /opt


      - name: Debug APK bouwen
        working-directory: Lotus
        run: |
          printf 'sdk.dir=%s\n' "$HOME/android-sdk" > local.properties
          /opt/gradle-8.7/bin/gradle --no-daemon --console=plain assembleDebug


      - name: Debug APK bewaren
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-debug-APK
          path: Lotus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

