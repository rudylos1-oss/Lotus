name: Build Lotus debug APK\n\non:\n  workflow_dispatch:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\npermissions:\n  contents: read\n\njobs:\n  build-debug-apk:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    steps:\n      - name: Broncode ophalen\n        uses: actions/checkout@v4\n\n      - name: Java 17 instellen\n        uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: "17"\n          cache: gradle\n\n      - name: Android SDK instellen\n        uses: android-actions/setup-android@v3\n        with:\n          accept-android-sdk-licenses: false\n\n      - name: Android SDK-pakketten installeren\n        run: |\n          yes | sdkmanager --licenses || true\n          sdkmanager "platforms;android-35" "build-tools;34.0.0"\n\n      - name: Gradle 8.7 ophalen\n        run: |\n          curl --fail --location --retry 3 --output /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip\n          unzip -q /tmp/gradle-8.7-bin.zip -d /opt\n\n      - name: Debug APK bouwen\n        working-directory: Lotus\n        run: |\n          echo "sdk.dir=$ANDROID_HOME" > local.properties\n          /opt/gradle-8.7/bin/gradle --no-daemon --console=plain assembleDebug\n\n      - name: Debug APK bewaren\n        uses: actions/upload-artifact@v4\n        with:\n          name: Lotus-debug-APK\n          path: Lotus/app/build/outputs/apk/debug/app-debug.apk\n          if-no-files-found: error\n          retention-days: 14\n
